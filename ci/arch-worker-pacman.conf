[options]
Architecture = x86_64
CheckSpace
SigLevel = Required DatabaseOptional TrustedOnly
LocalFileSigLevel = Required TrustedOnly
XferCommand = /usr/bin/curl --ipv4 --fail --location --retry 3 --output %o %u

[core]
Server = https://archive.archlinux.org/repos/2026/09/24/core/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/09/24/extra/os/$arch
