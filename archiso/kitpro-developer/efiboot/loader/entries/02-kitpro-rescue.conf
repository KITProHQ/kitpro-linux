title    KITPro Linux Rescue (Development)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=7G console=ttyS0,115200n8 console=tty0 systemd.show_status=yes kitpro.mode=rescue
